
{% extends "base.html" %}

{% block content %}
<div class="container py-4" style="max-width:850px">
  <div class="card border-0 shadow rounded-4 overflow-hidden">
    <div class="p-4 text-white" style="background:linear-gradient(120deg,#172554,#4338ca,#0891b2)">
      <div class="small text-uppercase">Admin tools</div>
      <h1 class="h3 fw-bold mt-2 mb-0">{{ page_title }}</h1>
    </div>

    <div class="card-body p-4 p-md-5">
      <form method="post">
        {% csrf_token %}

        <div class="mb-3">
          <label for="question" class="form-label fw-semibold">Question *</label>
          <input class="form-control" id="question" name="question" maxlength="255" required
                 value="{{ faq.question|default:'' }}">
        </div>

        <div class="mb-3">
          <label for="answer" class="form-label fw-semibold">Answer *</label>
          <textarea class="form-control" id="answer" name="answer" rows="7" required>{{ faq.answer|default:'' }}</textarea>
        </div>

        <div class="mb-3">
          <label for="department" class="form-label fw-semibold">Department</label>
          <select class="form-select" id="department" name="department">
            <option value="">General / college-wide FAQ</option>
            {% for department in departments %}
            <option value="{{ department.id }}"
              {% if faq.department_id == department.id %}selected{% endif %}>
              {{ department.name }}
            </option>
            {% endfor %}
          </select>
        </div>

        <div class="form-check mb-4">
          <input class="form-check-input" id="is_active" name="is_active" type="checkbox"
                 {% if not faq or faq.is_active %}checked{% endif %}>
          <label class="form-check-label" for="is_active">Visible to students and staff</label>
        </div>

        <div class="d-flex flex-wrap gap-2">
          <button class="btn btn-primary" type="submit">Save FAQ</button>
          <a class="btn btn-outline-secondary" href="{% url 'helpdesk:admin_faqs' %}">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
