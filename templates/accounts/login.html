{% extends "base.html" %}

{% block title %}
Login | College Students Help Desk
{% endblock %}


{% block content %}

<div class="auth-page">

    <div class="login-card">

        <div class="brand-icon">
            🎓
        </div>

        <h2>
            College Students
            <br>
            Help Desk
        </h2>

        <p class="text-muted">
            Sign in to continue
        </p>


        {% if form.errors %}

        <div class="alert alert-danger">
            Invalid username or password.
        </div>

        {% endif %}


        <form method="post">

            {% csrf_token %}

            <div class="mb-3">

                <label class="form-label">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Enter username"
                    required
                >

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn btn-primary w-100"
            >
                Login
            </button>
            <div class="text-center mt-3">
    <span class="text-muted">Don't have an account?</span>
    <a href="{% url 'accounts:register' %}">
        Create Account
    </a>
</div>

        </form>

    </div>

</div>


{% endblock %}
